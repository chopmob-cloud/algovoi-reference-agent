[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-reference-agent"
version = "0.1.0"
description = "Apache 2.0 reference implementation of an agent that emits an AlgoVoi settlement-attestation-v1 receipt for a Base chain transaction. End-to-end worked example demonstrating the AlgoVoi-authored substrate discipline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "AlgoVoi", email = "chopmob@gmail.com" },
]
keywords = [
  "algovoi",
  "agent",
  "x402",
  "settlement-attestation",
  "jcs",
  "rfc8785",
  "agentic-payments",
  "base",
  "reference-implementation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "algovoi-substrate>=0.3.0",
  "algovoi-settlement-attestation>=0.1.0",
  "rfc8785>=0.1.4",
]

[project.optional-dependencies]
live = [
  "web3>=6.0",
]
test = [
  "pytest>=7",
]

[project.scripts]
algovoi-agent = "algovoi_reference_agent.cli:main"

[project.urls]
Homepage = "https://docs.algovoi.co.uk/acquisition"
Repository = "https://github.com/chopmob-cloud/algovoi-reference-agent"
Issues = "https://github.com/chopmob-cloud/algovoi-reference-agent/issues"
"IETF Settlement Attestation" = "https://datatracker.ietf.org/doc/draft-hopley-x402-settlement-attestation/"
"IETF Canonicalisation" = "https://datatracker.ietf.org/doc/draft-hopley-x402-canonicalisation-jcs-v1/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
